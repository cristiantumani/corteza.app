<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action items - Corteza</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#3953bd",
                "surface-variant": "#e4e2e4",
                "inverse-primary": "#b9c3ff",
                "on-primary": "#ffffff",
                "surface-container-highest": "#e4e2e4",
                outline: "#757684",
                "on-error": "#ffffff",
                "inverse-on-surface": "#f3f0f2",
                "surface-container-high": "#eae7ea",
                "on-secondary-fixed": "#2c0051",
                "surface-tint": "#3c55bf",
                "surface-dim": "#dcd9dc",
                "primary-container": "#546cd7",
                "surface-container": "#f0edef",
                "on-primary-container": "#fffbff",
                error: "#ba1a1a",
                "tertiary-fixed": "#6ffbbe",
                "primary-fixed-dim": "#b9c3ff",
                "surface-container-low": "#f6f3f5",
                "secondary-fixed": "#f0dbff",
                "on-tertiary-fixed-variant": "#005236",
                "on-primary-fixed-variant": "#1f3ba6",
                "secondary-container": "#ce9ffd",
                "on-background": "#1b1b1d",
                "surface-bright": "#fcf8fb",
                "primary-fixed": "#dde1ff",
                "on-surface-variant": "#444653",
                "tertiary-fixed-dim": "#4edea3",
                "on-error-container": "#93000a",
                "surface-container-lowest": "#ffffff",
                "on-tertiary-container": "#f5fff6",
                "on-tertiary": "#ffffff",
                "on-secondary": "#ffffff",
                tertiary: "#006947",
                secondary: "#754aa1",
                "on-secondary-fixed-variant": "#5c3187",
                "error-container": "#ffdad6",
                "tertiary-container": "#00855b",
                "on-tertiary-fixed": "#002113",
                "inverse-surface": "#303032",
                "outline-variant": "#c5c5d5",
                background: "#fcf8fb",
                "secondary-fixed-dim": "#dcb8ff",
                "on-surface": "#1b1b1d",
                "on-secondary-container": "#5a3086",
                "on-primary-fixed": "#001356",
                surface: "#fcf8fb"
              }
            }
          }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e2e4;
            border-radius: 10px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
    <!-- SideNavBar -->
<!-- SIDEBAR -->

    <!-- TopAppBar -->
    <header class="fixed top-0 right-0 left-64 h-16 z-10 flex items-center justify-between px-6 bg-surface border-b border-outline-variant shadow-sm">
        <h2 class="text-2xl font-bold text-on-surface">Action items</h2>
    </header>

    <!-- Main: list and filters (public/scripts/actions.js) -->
    <main class="ml-64 pt-16 h-screen overflow-y-auto bg-background">
        <div class="max-w-[1100px] mx-auto p-8">
            <p class="text-on-surface-variant mb-6">Commitments captured from your meetings: who owns them, and by when.</p>

            <div class="flex flex-wrap items-center gap-3 mb-6">
                <div class="inline-flex rounded-lg border border-outline-variant overflow-hidden" role="group" aria-label="Owner">
                    <button type="button" data-owner="me" class="owner-filter px-4 py-2 text-sm font-semibold">Mine</button>
                    <button type="button" data-owner="all" class="owner-filter px-4 py-2 text-sm font-semibold">Everyone</button>
                </div>
                <select id="status-filter" class="bg-surface-container-low border border-outline-variant rounded-lg py-2 px-3 text-sm">
                    <option value="open">Open</option>
                    <option value="done">Done</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="all">All statuses</option>
                </select>
                <select id="due-filter" class="bg-surface-container-low border border-outline-variant rounded-lg py-2 px-3 text-sm">
                    <option value="">Any due date</option>
                    <option value="overdue">Overdue</option>
                    <option value="week">Due in the next 7 days</option>
                    <option value="none">No due date</option>
                </select>
                <span id="items-count" class="text-sm text-on-surface-variant"></span>
            </div>

            <div id="items" class="flex flex-col gap-3">
                <p class="text-on-surface-variant">Loading…</p>
            </div>
        </div>
    </main>

    <script src="/scripts/actions.js?v=1"></script>
</body>
</html>
