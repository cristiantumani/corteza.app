<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t:actions.pageTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles/tailwind.min.css?v=12">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e2e4;
            border-radius: 10px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        /* Owner picker (public/scripts/people.js) in the edit form */
        .decision-action-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .decision-action-chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 10px; border-radius: 9999px; background: #F3F4F6; color: #171717; font-size: 12px; font-weight: 600; }
        .decision-action-chip button { background: none; border: none; cursor: pointer; margin-left: 2px; color: inherit; }
        .inline-edit-input { width: 100%; border: 1px solid #c4c6d0; border-radius: 8px; padding: 6px 10px; font-size: 14px; background: #fff; }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
    <!-- SideNavBar -->
<!-- SIDEBAR -->

    <!-- TopAppBar -->
    <header class="fixed top-0 right-0 left-64 h-16 z-10 flex items-center justify-between px-6 bg-surface border-b border-outline-variant shadow-sm">
        <h2 class="text-2xl font-bold text-on-surface">{{t:nav.actions}}</h2>
    </header>

    <!-- Main: list and filters (public/scripts/actions.js) -->
    <main class="ml-64 pt-16 h-screen overflow-y-auto bg-background">
        <div class="max-w-[1100px] mx-auto p-8">
            <p class="text-on-surface-variant mb-6">{{t:actions.intro}}</p>

            <div class="flex flex-wrap items-center gap-3 mb-6">
                <div class="inline-flex rounded-lg border border-outline-variant overflow-hidden" role="group" aria-label="{{t:actions.filters.owner}}">
                    <button type="button" data-owner="me" class="owner-filter px-4 py-2 text-sm font-semibold">{{t:actions.filters.mine}}</button>
                    <button type="button" data-owner="all" class="owner-filter px-4 py-2 text-sm font-semibold">{{t:actions.filters.everyone}}</button>
                </div>
                <!-- Active (open) or Resolved (done and cancelled) -->
                <div class="inline-flex rounded-lg border border-outline-variant overflow-hidden" role="tablist" aria-label="{{t:actions.tabs.label}}">
                    <button type="button" role="tab" data-status="open" class="status-tab px-4 py-2 text-sm font-semibold">{{t:actions.tabs.active}}</button>
                    <button type="button" role="tab" data-status="resolved" class="status-tab px-4 py-2 text-sm font-semibold">{{t:actions.tabs.resolved}}</button>
                </div>
                <select id="due-filter" class="bg-surface-container-low border border-outline-variant rounded-lg py-2 px-3 text-sm">
                    <option value="">{{t:actions.dueFilter.any}}</option>
                    <option value="overdue">{{t:actions.dueFilter.overdue}}</option>
                    <option value="today">{{t:actions.dueFilter.today}}</option>
                    <option value="week">{{t:actions.dueFilter.week}}</option>
                    <option value="none">{{t:actions.dueFilter.none}}</option>
                </select>
                <span id="items-count" class="text-sm text-on-surface-variant"></span>
            </div>

            <div id="from-colleagues" class="hidden mb-4 rounded-xl border border-primary/30 bg-surface-container-low p-4 text-sm text-on-surface" role="status"></div>

            <div id="loop-notice" class="hidden mb-4 flex flex-col gap-2 rounded-xl border border-primary/30 bg-surface-container-low p-4" role="status"></div>

            <div id="items" class="flex flex-col gap-3">
                <p class="text-on-surface-variant">{{t:common.loading}}</p>
            </div>
        </div>
    </main>

    <script src="/scripts/close-loop.js?v=2"></script>
    <script src="/scripts/people.js?v=3"></script>
    <script src="/scripts/actions.js?v=9"></script>
</body>
</html>
