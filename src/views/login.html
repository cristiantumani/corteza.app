<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{t:login.pageTitle}}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D0D0D;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      max-width: 420px;
      width: 100%;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .logo { width: 48px; height: 48px; margin-bottom: 16px; }
    h1 { color: #1d1d1f; font-size: 26px; margin-bottom: 8px; }
    .subtitle { color: #666; font-size: 15px; line-height: 1.5; margin-bottom: 32px; }
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: white;
      color: #3c4043;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .google-btn:hover { background: #f8f9fa; box-shadow: 0 1px 3px rgba(60, 64, 67, 0.3); }
    .google-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
    .error {
      display: none;
      background: #fdecea;
      color: #b3261e;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: left;
    }
    .note { color: #888; font-size: 13px; line-height: 1.5; margin-top: 24px; }
    .legal { margin-top: 16px; font-size: 12px; }
    .legal a { color: #888; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/favicon.svg" alt="Corteza">
    <h1>{{t:login.title}}</h1>
    <p class="subtitle">{{t:login.subtitle}}</p>

    <div class="error" id="error" role="alert"></div>

    <a class="google-btn" id="google-btn" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      {{t:login.google}}
    </a>

    <p class="note">{{t:login.note}}</p>
    <p class="legal"><a href="/terms">{{t:login.terms}}</a> · <a href="/privacy">{{t:login.privacy}}</a></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);

    const error = params.get('error');
    if (error) {
      const errorEl = document.getElementById('error');
      errorEl.textContent = error;
      errorEl.style.display = 'block';
    }

    // Keep the page the user was trying to open (set by requireAuthBrowser)
    const returnTo = params.get('return');
    if (returnTo && returnTo.startsWith('/') && !returnTo.startsWith('//')) {
      document.getElementById('google-btn').href = '/auth/google?return=' + encodeURIComponent(returnTo);
    }
  </script>
</body>
</html>
