<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t:questions.pageTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/styles/tailwind.min.css?v=13">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e4e2e4;
            border-radius: 10px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal {
            background: white;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden">
    <!-- SideNavBar -->
<!-- SIDEBAR -->

    <!-- TopAppBar -->
    <header class="fixed top-0 right-0 left-64 h-16 z-10 flex items-center justify-between px-6 bg-surface border-b border-outline-variant shadow-sm">
        <h2 class="text-2xl font-bold text-on-surface">{{t:nav.questions}}</h2>
    </header>

    <!-- Main: list and filters (public/scripts/questions.js) -->
    <main class="ml-64 pt-16 h-screen overflow-y-auto bg-background">
        <div class="max-w-[1100px] mx-auto p-8">
            <p class="text-on-surface-variant mb-6">{{t:questions.intro}}</p>

            <div class="flex flex-wrap items-center gap-3 mb-6">
                <div class="inline-flex rounded-lg border border-outline-variant overflow-hidden" role="group" aria-label="{{t:questions.filters.type}}">
                    <button type="button" data-type="all" class="type-filter px-4 py-2 text-sm font-semibold">{{t:questions.filters.all}}</button>
                    <button type="button" data-type="open_question" class="type-filter px-4 py-2 text-sm font-semibold">{{t:questions.filters.questions}} <span data-count="open_question"></span></button>
                    <button type="button" data-type="risk" class="type-filter px-4 py-2 text-sm font-semibold">{{t:types.plural.risk}} <span data-count="risk"></span></button>
                </div>
                <select id="status-filter" class="bg-surface-container-low border border-outline-variant rounded-lg py-2 px-3 text-sm" aria-label="{{t:actions.statusLabel}}">
                    <option value="open">{{t:questions.status.open}}</option>
                    <option value="resolved">{{t:questions.status.resolved}}</option>
                    <option value="all">{{t:questions.filters.all}}</option>
                </select>
                <span id="items-count" class="text-sm text-on-surface-variant"></span>
            </div>

            <div id="topic-banner" class="hidden mb-4 rounded-xl border border-outline-variant bg-surface-container-low p-3 text-sm text-on-surface" role="status"></div>
            <div id="loop-notice" class="hidden mb-4 flex flex-col gap-2 rounded-xl border border-primary/30 bg-surface-container-low p-4" role="status"></div>

            <div id="items" class="flex flex-col gap-3">
                <p class="text-on-surface-variant">{{t:common.loading}}</p>
            </div>
        </div>
    </main>

    <script src="/scripts/close-loop.js?v=3"></script>
    <script src="/scripts/questions.js?v=4"></script>
</body>
</html>
