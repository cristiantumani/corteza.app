<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{t:search.pageTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="stylesheet" href="/styles/tailwind.min.css?v=13">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="/styles/dashboard.css?v=6">

    <style>
        /* Search has no edit/delete dialogs: fields are edited in place in the source pop-up */
        #detail-modal .edit-btn, #detail-modal .delete-btn { display: none !important; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
        }
        .intelligence-gradient {
            background: #0D0D0D;
        }
        .evidence-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .evidence-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .prompt-container {
            position: fixed;
            bottom: 0;
            left: 256px;
            right: 0;
            background: linear-gradient(to top, #FFFFFF 90%, transparent);
            padding: 20px 48px 32px;
            z-index: 30;
        }
        @media (max-width: 767px) {
            .prompt-container { left: 0; padding: 12px 16px 16px; }
        }
    </style>

</head>
<body class="text-on-surface">

<!-- Sidebar Navigation (Same as dashboard) -->
<!-- SIDEBAR -->

<!-- Main Content -->
<main class="ml-64 p-12 pb-48 min-h-screen" id="main-content">
    <div class="max-w-[1600px] mx-auto">

        <!-- Space Context Indicator -->
        <div data-multi-space class="flex items-center gap-3 mb-6 px-4 py-3 bg-surface-container-low border border-outline-variant rounded-xl">
            <span class="material-symbols-outlined text-primary">folder</span>
            <div>
                <div class="text-xs text-on-surface-variant font-medium uppercase tracking-wider">{{t:search.searchingIn}}</div>
                <div id="search-current-space" class="font-bold text-on-surface">{{t:search.loadingSpace}}</div>
            </div>
        </div>

        <!-- Decide and close: a typed decision and what it would close (public/scripts/decide-card.js) -->
        <div id="decide-panel" class="hidden max-w-3xl mx-auto mb-8"></div>

        <!-- Loading State -->
        <div id="search-loading" class="hidden text-center py-20">
            <div class="text-6xl mb-4">🔍</div>
            <div class="text-lg text-on-surface-variant">{{t:home.ask.looking}}</div>
        </div>

        <!-- Search Results Container -->
        <div id="search-results" class="hidden">

            <!-- Synthesized Intelligence Header -->
            <div class="intelligence-gradient rounded-2xl p-10 mb-8 text-on-primary shadow-xl">
                <div class="flex items-start gap-4 mb-6">
                    <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">psychology</span>
                    </div>
                    <div class="flex-1">
                        <h2 class="text-3xl font-bold mb-2">{{t:detail.answer}}</h2>
                        <p class="text-lg opacity-90" id="search-query-display"></p>
                    </div>
                    <button onclick="clearSearch()" aria-label="{{t:search.clear}}" class="p-2 hover:bg-white/20 rounded-lg transition-colors">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <div class="bg-white/10 backdrop-blur-sm rounded-xl p-6">
                    <p class="text-lg leading-relaxed whitespace-pre-line" id="synthesized-response"></p>
                </div>

                <!-- Sources marked "not related": offer to answer again without them -->
                <div id="excluded-banner" class="hidden mt-4 flex flex-wrap items-center justify-between gap-3 bg-white/15 rounded-xl px-5 py-3 text-sm"></div>

                <div class="mt-6 flex items-center gap-4 text-sm opacity-75">
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">source</span>
                        <span id="results-count"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">schedule</span>
                        <span id="search-timestamp"></span>
                    </div>
                </div>
            </div>

            <!-- Open action items the question is about ("What's pending from Ana?"), filled by ai-search.js -->
            <div id="search-action-items" class="hidden mb-10"></div>

            <!-- Evidence Sources: what the answer is based on (full width; the old "Intelligence Breakdown" repeated the same outcomes) -->
            <div>
                <h3 class="text-2xl font-bold mb-6 flex items-center gap-3">
                    <span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">folder_open</span>
                    {{t:search.sources}}
                </h3>

                <div id="evidence-sources" class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
                    <!-- Evidence cards will be inserted here -->
                </div>
            </div>

            <!-- Related Topics -->
            <div class="mt-12">
                <h4 class="text-lg font-semibold mb-4 text-on-surface-variant">{{t:search.related}}</h4>
                <div id="related-topics" class="flex flex-wrap gap-2">
                    <!-- Tags will be inserted here -->
                </div>
            </div>

        </div>

        <!-- Empty State (Initial) -->
        <div id="empty-state" class="text-center py-20">
            <div class="text-8xl mb-6">🔍</div>
            <h2 class="text-3xl font-bold mb-4">{{t:home.ask.label}}</h2>
            <p class="text-lg text-on-surface-variant max-w-xl mx-auto mb-8">
                {{t:search.intro}}
            </p>
            <div id="search-examples" class="max-w-2xl mx-auto space-y-3">
                <button type="button" data-example-mine data-query="{{t:search.ex.mine}}" class="search-example w-full text-left px-6 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary transition-all">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">task_alt</span>
                        <span class="font-medium">{{t:search.ex.mine}}</span>
                    </div>
                </button>
                <button type="button" data-example-person data-query="{{t:search.ex.person}}" class="search-example w-full text-left px-6 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary transition-all">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">person</span>
                        <span class="font-medium">{{t:search.ex.person}}</span>
                    </div>
                </button>
                <button type="button" data-query="{{t:search.ex.pricing}}" class="search-example w-full text-left px-6 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary transition-all">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
                        <span class="font-medium">{{t:search.ex.pricing}}</span>
                    </div>
                </button>
                <button type="button" data-query="{{t:search.ex.open}}" class="search-example w-full text-left px-6 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl hover:border-primary transition-all">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 0;">help</span>
                        <span class="font-medium">{{t:search.ex.open}}</span>
                    </div>
                </button>
            </div>
        </div>

    </div>
</main>

<!-- Floating Prompt Input -->
<div class="prompt-container">
    <div class="max-w-[1600px] mx-auto">
        <div class="bg-surface-container-lowest border-2 border-outline-variant rounded-2xl shadow-2xl overflow-hidden focus-within:border-primary transition-all">
            <div class="flex items-end gap-4 p-4">
                <div class="flex-1">
                    <textarea
                        id="search-input"
                        rows="1"
                        placeholder="{{t:home.ask.placeholder}}"
                        class="w-full bg-transparent border-none outline-none resize-none text-base"
                        onkeydown="handleSearchKeydown(event)"
                    ></textarea>
                </div>
                <button
                    onclick="performSearchFromInput()"
                    id="search-button" aria-label="{{t:search.send}}"
                    class="bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-bold p-3 rounded-xl transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                    <span class="material-symbols-outlined">send</span>
                </button>
            </div>
            <div class="px-4 pb-3 flex items-center gap-2 text-xs text-on-surface-variant">
                <span class="material-symbols-outlined text-sm">info</span>
                <span>{{t:search.enterHint}}</span>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<!-- DETAIL_MODAL -->

<script>
    // Initialize workspace ID
    var WORKSPACE_ID = '<WORKSPACE_ID>';
</script>
<!-- BOOTSTRAP -->
<script src="/scripts/people.js?v=3"></script>
<script src="/scripts/decision-actions.js?v=3"></script>
<script src="/scripts/inline-edit.js?v=5"></script>
<script src="/scripts/may-close.js?v=2"></script>
<script src="/scripts/sensitive.js?v=1"></script>
<script src="/scripts/dashboard.js?v=36"></script>
<script src="/scripts/decide-words.js?v=1"></script>
<script src="/scripts/decide-card.js?v=1"></script>
<script src="/scripts/ai-search.js?v=13"></script>

<!-- Initialize Space Context Indicator -->
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      let currentSpaceId = urlParams.get('space') || localStorage.getItem('corteza_last_space_id');

      const spaceDisplayEl = document.getElementById('search-current-space');

      if (!currentSpaceId) {
        spaceDisplayEl.textContent = 'No space selected';
        spaceDisplayEl.style.color = '#ef4444';
        return;
      }

      // Fetch user and workspace info
      const userData = await fetch('/auth/me').then(r => r.json());
      const workspaceId = userData.user?.workspace_id;

      if (!workspaceId) {
        spaceDisplayEl.textContent = 'Error loading workspace';
        spaceDisplayEl.style.color = '#ef4444';
        return;
      }

      // Fetch spaces
      const spacesRes = await fetch(`/api/spaces?workspace_id=${workspaceId}`);
      const spacesData = await spacesRes.json();

      if (!spacesRes.ok || !spacesData.spaces) {
        spaceDisplayEl.textContent = 'Error loading spaces';
        spaceDisplayEl.style.color = '#ef4444';
        return;
      }

      // Find current space
      const currentSpace = spacesData.spaces.find(s => s.space_id === currentSpaceId);
      if (currentSpace) {
        spaceDisplayEl.textContent = `${currentSpace.settings?.icon || '📁'} ${currentSpace.name}`;
        spaceDisplayEl.style.color = '';
      } else {
        spaceDisplayEl.textContent = 'Space not found';
        spaceDisplayEl.style.color = '#ef4444';
      }
    } catch (error) {
      console.error('Error loading space context:', error);
      const spaceDisplayEl = document.getElementById('search-current-space');
      if (spaceDisplayEl) {
        spaceDisplayEl.textContent = 'Error loading space';
        spaceDisplayEl.style.color = '#ef4444';
      }
    }
  });

</script>

</body>
</html>
