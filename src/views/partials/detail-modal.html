<!-- Outcome detail modal, shared by Home and Search (injected by src/http/page-partials.js at DETAIL_MODAL) -->
<!-- Decision Detail Modal -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal detail-modal">
    <div class="detail-header">
      <h2 id="detail-title">{{t:detail.title}}</h2>
      <div style="display: flex; gap: 10px;">
        <button class="edit-btn" onclick="openEditModal()">✏️ {{t:common.edit}}</button>
        <button class="delete-btn" onclick="deleteCurrentDecision()" style="background: #C62828; color: white; padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.9'" onmouseout="this.style.opacity='1'">🗑️ {{t:common.delete}}</button>
        <button class="close-btn" onclick="closeDetailModal()">✕ {{t:common.close}}</button>
      </div>
    </div>

    <!-- Search only (public/scripts/ai-search.js): is this source related to the question? -->
    <div class="detail-relevance" id="detail-relevance" style="display: none;"></div>

    <div class="detail-section">
      <h3 id="detail-content-label">{{t:types.decision}}</h3>
      <div class="content" id="detail-decision-text"></div>
    </div>

    <!-- Earlier items this outcome may close (public/scripts/may-close.js) -->
    <div class="detail-section" id="detail-may-close" style="display: none;"></div>

    <div class="detail-section" id="detail-rationale-section" style="display: none;">
      <h3>{{t:detail.why}}</h3>
      <div class="content" id="detail-rationale"></div>
    </div>

    <!-- Where an AI-captured outcome came from: the supporting quote and the meeting (dashboard.js renderDetailEvidence) -->
    <div class="detail-section" id="detail-evidence-section" style="display: none;">
      <h3>{{t:detail.evidence}}</h3>
      <div class="content flex flex-col gap-2" id="detail-evidence"></div>
    </div>

    <!-- Open questions and risks: the answer, or whether the risk was mitigated (dashboard.js renderDetailResolution) -->
    <div class="detail-section" id="detail-resolution-section" style="display: none;">
      <h3 id="detail-resolution-label">{{t:detail.answer}}</h3>
      <div class="content" id="detail-resolution"></div>
    </div>

    <div class="detail-section" id="detail-actions-section" style="display: none;">
      <h3>{{t:nav.actions}}</h3>
      <div class="content" id="detail-actions"></div>
    </div>

    <div class="detail-grid">
      <!-- Added by (decisions), raised by (risks); hidden when nobody is known -->
      <div class="detail-item" id="detail-creator-container">
        <label id="detail-creator-label">{{t:detail.addedBy}}</label>
        <div class="value" id="detail-creator"></div>
      </div>
      <div class="detail-item">
        <label>{{t:detail.date}}</label>
        <div class="value" id="detail-date"></div>
      </div>
      <div class="detail-item" id="detail-owner-container" style="display: none;">
        <label>{{t:detail.accountable}}</label>
        <div class="value" id="detail-owner"></div>
        <p class="detail-help" id="detail-owner-help">{{t:detail.accountableHelp}}</p>
      </div>
      <!-- Older captures only: decisions no longer have due dates (they belong to action items) -->
      <div class="detail-item" id="detail-due-container" style="display: none;">
        <label>{{t:detail.dueOlder}}</label>
        <div class="value" id="detail-due"></div>
      </div>
    </div>

    <div class="detail-section" id="detail-meeting-section" style="display: none;">
      <h3>{{t:detail.context}}</h3>
      <div class="content" id="detail-meeting-info"></div>
    </div>

    <div class="detail-section" id="detail-epic-section" style="display: none;">
      <h3>{{t:log.epic}}</h3>
      <div class="content" id="detail-epic-info"></div>
    </div>

  </div>
</div>
