<!-- Shared app sidebar. Injected at the SIDEBAR placeholder by src/http/page-partials.js, which marks the
     current page's link with aria-current="page". Styled here (not with Tailwind classes) so it
     looks the same on pages built with tailwind.min.css and on pages using the Tailwind CDN. -->
<style>
  .corteza-sidebar {
    position: fixed; top: 0; left: 0; z-index: 20;
    width: 16rem; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column;
    padding: 1.5rem 0.75rem;
    background: #f6f3f5; border-right: 1px solid #e4e1e8;
    font-family: 'Inter', sans-serif;
  }
  .corteza-sidebar a { text-decoration: none; }
  .corteza-sidebar .sb-brand {
    display: flex; align-items: center; gap: 0.625rem;
    padding: 0 0.75rem; margin-bottom: 2rem;
    font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: #1b1b1d;
  }
  .corteza-sidebar .sb-brand img { width: 2rem; height: 2rem; border-radius: 0.5rem; }
  .corteza-sidebar .sb-nav { display: flex; flex-direction: column; gap: 0.25rem; flex: 1; }
  .corteza-sidebar .sb-link {
    display: flex; align-items: center; gap: 0.75rem;
    height: 2.5rem; padding: 0 0.75rem; border-radius: 0.5rem;
    font-size: 0.875rem; font-weight: 500; line-height: 1; color: #444653;
    background: none; border: 0; width: 100%; cursor: pointer; text-align: left;
    transition: background-color 150ms, color 150ms;
  }
  .corteza-sidebar .sb-link:hover { background: #ebe7ec; color: #1b1b1d; }
  .corteza-sidebar .sb-link[aria-current="page"] { background: #e3e7fb; color: #3953bd; font-weight: 600; }
  .corteza-sidebar .sb-link .material-symbols-outlined {
    font-size: 1.25rem !important; width: 1.25rem; flex-shrink: 0;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
  }
  .corteza-sidebar .sb-link[aria-current="page"] .material-symbols-outlined {
    font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20;
  }
  /* Space controls only matter with 2+ spaces; pages set body.single-space when there's one */
  body.single-space [data-multi-space] { display: none !important; }
  /* A regular link; only Buy Me a Coffee's yellow cup stands out */
  .corteza-sidebar .sb-link .sb-icon-img { width: 1.25rem; height: 1.25rem; object-fit: contain; flex-shrink: 0; }
  .corteza-sidebar .sb-footer {
    display: flex; flex-direction: column; gap: 0.25rem;
    margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e4e1e8;
  }

  /* Phones (public/scripts/mobile-nav.js): the sidebar is a drawer opened from the top bar,
     and the page takes the full width. Pages keep their desktop classes (ml-64, left-64). */
  .cz-menu-btn, .cz-mobile-header { display: none; }
  @media (max-width: 767px) {
    .corteza-sidebar {
      z-index: 40; visibility: hidden; transform: translateX(-100%);
      transition: transform 200ms ease, visibility 200ms;
    }
    body.cz-nav-open .corteza-sidebar { visibility: visible; transform: none; box-shadow: 0 0 32px rgba(27, 27, 29, 0.25); }
    .corteza-sidebar .sb-link { height: 2.75rem; }
    .cz-nav-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(27, 27, 29, 0.4); }
    .cz-menu-btn {
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      width: 2.75rem; height: 2.75rem; margin-left: -0.5rem; border: 0; border-radius: 0.5rem;
      background: none; color: #1b1b1d; cursor: pointer;
    }
    .cz-menu-btn:hover { background: #ebe7ec; }
    .cz-menu-btn .material-symbols-outlined { font-size: 1.5rem !important; }
    .cz-mobile-header {
      display: flex; align-items: center; gap: 0.5rem; position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      height: 3.5rem; padding: 0 1rem; background: #fcf8fb; border-bottom: 1px solid #e4e1e8;
    }
    .cz-mobile-brand { font: 800 1.125rem/1 'Inter', sans-serif; letter-spacing: -0.02em; color: #1b1b1d; text-decoration: none; }
    body .ml-64 { margin-left: 0 !important; }
    body .left-64 { left: 0 !important; }
    body > header.fixed { width: auto !important; padding-left: 1rem !important; padding-right: 1rem !important; gap: 0.5rem; }
    body > header.fixed > .cz-menu-btn + * { margin-right: auto; } /* the page title sits next to the menu button */
    main > div.p-8 { padding: 1.25rem 1rem !important; }
    #main-content.p-12 { padding: 1.25rem 1rem !important; }
    body.cz-own-header #main-content { padding-top: 4.75rem !important; }
  }
  @media (prefers-reduced-motion: reduce) { .corteza-sidebar { transition: none; } }
</style>
<aside class="corteza-sidebar" aria-label="{{t:nav.main}}">
  <a class="sb-brand" href="/dashboard">
    <img src="/favicon-96x96.png" alt="">
    Corteza
  </a>

  <nav class="sb-nav">
    <a class="sb-link" data-nav="home" href="/dashboard">
      <span class="material-symbols-outlined" aria-hidden="true">home</span>{{t:nav.home}}
    </a>
    <a class="sb-link" data-nav="actions" href="/actions">
      <span class="material-symbols-outlined" aria-hidden="true">task_alt</span>{{t:nav.actions}}
    </a>
    <a class="sb-link" data-nav="questions" href="/questions">
      <span class="material-symbols-outlined" aria-hidden="true">contact_support</span>{{t:nav.questions}}
    </a>
    <a class="sb-link" data-nav="search" href="/ai-search">
      <span class="material-symbols-outlined" aria-hidden="true">search</span>{{t:nav.search}}
    </a>
    <a class="sb-link" data-nav="settings" href="/settings">
      <span class="material-symbols-outlined" aria-hidden="true">settings</span>{{t:nav.settings}}
    </a>
  </nav>

  <div class="sb-footer">
    <!-- Beta testers can chip in for the AI costs (a plain link: the CSP allows no third-party widgets) -->
    <a class="sb-link" href="https://buymeacoffee.com/corteza.app" target="_blank" rel="noopener">
      <img class="sb-icon-img" src="/images/bmc-cup.png" alt="" width="14" height="20">{{t:nav.coffee}}
    </a>
    <!-- Opens the Log modal where the page has it (Home, Search); elsewhere goes to Home with ?log=1 -->
    <a class="sb-link" href="/dashboard?log=1"
       onclick="if (typeof window.openLogMemoryModal === 'function') { event.preventDefault(); window.openLogMemoryModal(); }">
      <span class="material-symbols-outlined" aria-hidden="true">edit_note</span>{{t:nav.log}}
    </a>
    <!-- Opens the first-run steps again (on Home directly; elsewhere via /dashboard?tour=1) -->
    <a class="sb-link" href="/dashboard?tour=1"
       onclick="if (window.CortezaOnboarding) { event.preventDefault(); window.CortezaOnboarding.open(); }">
      <span class="material-symbols-outlined" aria-hidden="true">help</span>{{t:nav.howItWorks}}
    </a>
    <a class="sb-link" href="/auth/logout">
      <span class="material-symbols-outlined" aria-hidden="true">logout</span>{{t:nav.logout}}
    </a>
  </div>
</aside>
<!-- Phone layout: the sidebar as a drawer -->
<script src="/scripts/mobile-nav.js?v=2" defer></script>
<!-- Reports the browser's time zone (daily summary at 8:00 local time) -->
<script src="/scripts/timezone.js?v=1" defer></script>
<!-- Count of new action items colleagues assigned (core/actions/colleague-assignments) -->
<script src="/scripts/assigned-badge.js?v=1" defer></script>
