name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Dependency audit (production, high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017

      # The whole suite again with meeting content encrypted (core/crypto); filters on encrypted fields throw
      - name: Test with field encryption
        run: DATA_KEK=$(openssl rand -hex 32) npm test
        env:
          TEST_MONGODB_URI: mongodb://localhost:27017
          FIELD_ENCRYPTION: 'on'
          FIELD_ENCRYPTION_STRICT: 'true'
